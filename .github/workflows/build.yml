name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Show repo files
        run: ls -R | head -50

      - name: Find project folder
        id: find
        run: |
          S=$(find . -name settings.gradle.kts -not -path "./node_modules/*" | head -1)
          if [ -z "$S" ]; then echo "settings.gradle.kts paoa jayni"; exit 1; fi
          echo "dir=$(dirname "$S")" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Build debug APK
        working-directory: ${{ steps.find.outputs.dir }}
        run: gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: VideoRecovery-apk
          path: "**/build/outputs/apk/debug/*.apk"
